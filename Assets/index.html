<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dynamic Island</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#f4f6ff;color-scheme:dark;--glow:#8b9dff;--glow2:#b6e5ff;--edge:70%;}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{display:flex;justify-content:center;align-items:flex-start;padding:3px}
.island{position:relative;width:100%;min-height:54px;border-radius:29px;background:rgba(16,19,29,.96);border:1px solid rgba(255,255,255,.14);box-shadow:0 8px 32px #0009,0 0 20px color-mix(in srgb,var(--glow) var(--edge),transparent);overflow:hidden;transition:background .25s,border-color .25s}
.edge{position:absolute;inset:0;border-radius:inherit;pointer-events:none;border:1px solid var(--glow);box-shadow:inset 0 0 14px color-mix(in srgb,var(--glow) 35%,transparent),0 0 13px var(--glow);opacity:calc(var(--edge)/100)}
.pill{height:54px;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;position:relative;z-index:2;user-select:none}
.dot{width:7px;height:7px;border-radius:50%;background:var(--glow2);box-shadow:0 0 10px var(--glow2)}.brand{font-size:12px;font-weight:800;letter-spacing:2px}.sub{font-size:10px;color:#a7aec2;letter-spacing:1.5px}.chev{color:#a7aec2;margin-left:4px}
#panel{display:none;padding:4px 17px 17px;position:relative;z-index:1}.island.open #panel{display:block}header{display:flex;align-items:center;justify-content:space-between;margin:2px 0 13px}small{font-size:9px;letter-spacing:2px;color:var(--glow2)}h1{font-size:18px;margin:3px 0 0}h2{font-size:14px;margin:0 0 7px}p{font-size:11px;line-height:1.45;color:#aeb5c8;margin:4px 0 8px}
button,select,input,textarea{font:inherit;color:inherit}button{border:1px solid #ffffff1c;background:#ffffff0b;border-radius:11px;cursor:pointer;transition:.16s}button:hover{background:color-mix(in srgb,var(--glow) 25%,#ffffff10);border-color:var(--glow)}#close{width:28px;height:28px;font-size:18px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tiles button{height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:10px}.tiles .ico{font-size:19px;color:var(--glow2)}#content{margin-top:13px;padding:12px;border-radius:13px;background:#ffffff09;border:1px solid #ffffff12;min-height:64px}
.action{padding:8px 11px;margin:4px 4px 0 0;font-size:11px}.field{width:100%;background:#0c101a;border:1px solid #ffffff25;border-radius:9px;padding:9px;margin:6px 0;font-size:12px;outline:none}.field:focus{border-color:var(--glow)}textarea.field{height:62px;resize:none}.row{display:flex;gap:7px;align-items:center}.row>*{flex:1}.muted{color:#929bb1;font-size:10px}.swatch{display:inline-flex;align-items:center;gap:7px;font-size:11px;margin:7px 10px 0 0}.swatch input{width:30px;height:25px;padding:0;border:0;background:none}.range{width:100%;accent-color:var(--glow)}.history{max-height:72px;overflow:auto;font-size:10px;color:#9fa8bd}.theme-gaming{--glow:#3cff83;--glow2:#00eaff}.theme-cyberpunk{--glow:#ff36d7;--glow2:#00eaff}.theme-glass{--glow:#8b9dff;--glow2:#c4edff}.theme-light{--glow:#778bff;--glow2:#436bff;background:rgba(239,243,255,.98);color:#182137}.theme-air{--glow:#8bdcff;--glow2:#e0f8ff;background:rgba(25,43,57,.87)}.theme-gradient{--glow:#ff7a55;--glow2:#9561ff}.theme-light .sub,.theme-light p,.theme-light .muted{color:#58647a}.theme-light #content{background:#00000008;border-color:#00000013}.theme-light .field{background:#fff;color:#172033;border-color:#0002}.theme-light .tiles button{background:#00000008;color:#172033}
</style></head>
<body><div id="island" class="island theme-glass"><div class="edge"></div><div class="pill"><span class="dot"></span><span class="brand">DYNAMIC</span><span class="sub">ISLAND</span><span class="chev">⌄</span></div>
<main id="panel"><header><div><small>WINDOWS WIDGET</small><h1>Быстрый доступ</h1></div><button id="close" title="Свернуть">×</button></header>
<nav class="tiles">
<button data-page="music"><span class="ico">♫</span>Музыка</button><button data-page="notes"><span class="ico">✎</span>Заметки</button><button data-page="clipboard"><span class="ico">▣</span>Буфер обмена</button><button data-page="actions"><span class="ico">⚡</span>Быстрые действия</button><button data-page="appearance"><span class="ico">◈</span>Оформление</button><button data-page="settings"><span class="ico">⚙</span>Настройки</button>
</nav><section id="content"><h2>Привет!</h2><p>Наведи курсор на остров, чтобы открыть меню.</p></section></main></div>
<script>
const island=document.getElementById('island'),content=document.getElementById('content');let timer;
function native(msg){try{chrome.webview.postMessage(msg)}catch(e){}}
function expand(){clearTimeout(timer);island.classList.add('open');native('expand')}
function collapse(){timer=setTimeout(()=>{if(!island.matches(':hover')){island.classList.remove('open');native('collapse')}},420)}
island.addEventListener('mouseenter',expand);island.addEventListener('mouseleave',collapse);document.getElementById('close').onclick=()=>{island.classList.remove('open');native('collapse')};
const pages={
music:`<h2>Музыка</h2><p>Управление активным медиаплеером Windows с помощью мультимедийных клавиш.</p><button class="action" onclick="native('media:previous')">◀ Предыдущий</button><button class="action" onclick="native('media:playpause')">▶ / ⏸ Пуск / Пауза</button><button class="action" onclick="native('media:next')">Следующий ▶</button>`,
notes:`<h2>Заметки</h2><textarea class="field" id="note" placeholder="Напиши заметку..."></textarea><button class="action" onclick="saveNote()">Сохранить</button><span id="saved" class="muted"></span>`,
clipboard:`<h2>Буфер обмена</h2><input class="field" id="clip" placeholder="Текст для копирования"><button class="action" onclick="copyText()">Копировать в Windows</button><p id="clipStatus">Копирование отправляется в системный буфер обмена.</p><div class="history" id="history"></div>`,
actions:`<h2>Быстрые действия</h2><button class="action" onclick="copyText('')">Скопировать пустую строку</button><button class="action" onclick="location.reload()">Перезапустить интерфейс</button><p>Быстрые команды и полезные действия.</p>`,
appearance:`<h2>Оформление</h2><p>Тема острова</p><select class="field" id="theme" onchange="setTheme(this.value)"><option value="glass">Liquid Glass</option><option value="gaming">Gaming</option><option value="cyberpunk">Cyberpunk</option><option value="light">Light</option><option value="air">Air</option><option value="gradient">Gradient</option></select><div class="row"><label class="swatch">Цвет края <input type="color" id="edgeColor" value="#8b9dff" onchange="setColor(this.value)"></label><label class="swatch">Свечение</label></div><input class="range" type="range" min="10" max="100" value="70" oninput="setGlow(this.value)"><p class="muted">Цвет и яркость сохраняются автоматически.</p>`,
settings:`<h2>Настройки</h2><p>Запускать Dynamic Island вместе с Windows</p><button class="action" onclick="native('startup:on')">Включить автозапуск</button><button class="action" onclick="native('startup:off')">Выключить автозапуск</button><p>Скрытие при полноэкранном окне включено.</p><button class="action" onclick="native('hide')">Скрыть остров</button><button class="action" onclick="native('show')">Показать остров</button>`};
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{content.innerHTML=pages[b.dataset.page];if(b.dataset.page==='notes')document.getElementById('note').value=localStorage.getItem('di-note')||'';if(b.dataset.page==='appearance'){document.getElementById('theme').value=localStorage.getItem('di-theme')||'glass';document.getElementById('edgeColor').value=localStorage.getItem('di-color')||'#8b9dff'}});
function setTheme(t){island.className='island theme-'+t+' open';localStorage.setItem('di-theme',t)}function setColor(c){island.style.setProperty('--glow',c);localStorage.setItem('di-color',c)}function setGlow(v){island.style.setProperty('--edge',v+'%');localStorage.setItem('di-glow',v)}
function saveNote(){localStorage.setItem('di-note',document.getElementById('note').value);document.getElementById('saved').textContent='Сохранено'}
function copyText(value){const v=value??document.getElementById('clip').value;native('copy:'+v);let h=JSON.parse(localStorage.getItem('di-history')||'[]');if(v){h.unshift(v);h=h.slice(0,5);localStorage.setItem('di-history',JSON.stringify(h))}const s=document.getElementById('clipStatus');if(s)s.textContent='Отправлено в буфер обмена Windows';const list=document.getElementById('history');if(list)list.textContent=h.map(x=>'• '+x.slice(0,60)).join('\n')}
const theme=localStorage.getItem('di-theme')||'glass';island.className='island theme-'+theme;const color=localStorage.getItem('di-color');if(color)island.style.setProperty('--glow',color);const glow=localStorage.getItem('di-glow');if(glow)island.style.setProperty('--edge',glow+'%');
</script></body></html>
