name: Build DynamicIsland.exe

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Install .NET SDK on the build machine
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish portable Windows x64 EXE
        shell: pwsh
        run: >-
          dotnet publish DynamicIsland.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=true
          -o publish

      - name: Check output
        shell: pwsh
        run: |
          if (!(Test-Path 'publish/DynamicIsland.exe')) { throw 'DynamicIsland.exe was not produced.' }
          Get-Item 'publish/DynamicIsland.exe' | Format-List Name,Length

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-Windows-x64
          path: publish/DynamicIsland.exe
          if-no-files-found: error
          retention-days: 14
